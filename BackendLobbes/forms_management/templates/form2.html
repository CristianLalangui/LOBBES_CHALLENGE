<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobees - Meeting Confirmation</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>

    body {
      background-image: url("https://static.vecteezy.com/system/resources/thumbnails/046/370/769/small/blue-sky-and-clouds-background-view-from-the-airplane-photo.jpg");
      background-repeat: no-repeat;
      background-size: cover;
      background-color: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .form-card {
      max-width: 450px;
      width: 100%;
      padding: 2rem;
      background: white;
      border-radius: 45px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="form-card dashed">
  <h2 class="text-center mb-4 text-primary">Meeting Confirmation</h2>

  <form method="POST"  action="/form/step2/submit/?idLead={{ idLead }}">
       {% csrf_token %}
    <input type="hidden" name="idLead" value="{{ idLead }}">


    <div class="mb-4">
      <label class="form-label fw-bold">Does this proposed time work for you?</label>
      <select name="proposedTime" class="form-select" required>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="form-label fw-bold">Select a prefered time</label>
      <select name="preferedTime" class="form-select" required>
        <option value="afternoon">Afternoon</option>
        <option value="moorning">Moorning</option>
      </select>
    </div>

    <!-- Pregunta 3: Fecha -->
    <div class="mb-4 " >
      <label class="form-label fw-bold">Coments: </label>
       <textarea class="form-control" placeholder="Write your comments here" name="comments">
-
       </textarea>
    </div>

    <div class="d-grid mt-4">
      <button type="submit" class="btn btn-primary btn-lg botonRadius border-primary rounded-5 shadow">Save </button>
    </div>
  </form>
</div>

</body>
</html>
